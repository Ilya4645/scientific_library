{% extends 'base.html' %}
{% load static %}

{% block title %}Вход - Научная библиотека{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-box-arrow-in-right"></i> Вход в систему
                    </h3>
                </div>
                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle"></i>
                                Неверное имя пользователя или пароль
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label">
                                <i class="bi bi-person"></i> Имя пользователя
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg"
                                   id="id_username" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">
                                <i class="bi bi-lock"></i> Пароль
                            </label>
                            <input type="password" name="password" class="form-control form-control-lg"
                                   id="id_password" required>
                        </div>

                        <div class="mb-3 text-end">
                            <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">
                                <i class="bi bi-key"></i> Забыли пароль?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0">
                            Нет аккаунта?
                            <a href="{% url 'accounts:register' %}" class="text-decoration-none">
                                Зарегистрируйтесь
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
