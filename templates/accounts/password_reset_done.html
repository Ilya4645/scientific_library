{% extends 'base.html' %}
{% load static %}

{% block title %}Письмо отправлено - Научная библиотека{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 text-center">
                <div class="card-header bg-success text-white text-center py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-check-circle"></i> Письмо отправлено
                    </h3>
                </div>
                <div class="card-body p-5">
                    <i class="bi bi-envelope-check fs-1 text-success mb-3 d-block"></i>
                    <h4>Проверьте вашу почту</h4>
                    <p class="text-muted mt-3">
                        Мы отправили инструкцию по восстановлению пароля
                    </p>
                    
                    <hr class="my-4">
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> Вернуться ко входу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
