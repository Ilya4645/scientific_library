{% extends 'base.html' %}
{% load static %}

{% block title %}Пополнение баланса - Научная библиотека{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center">
                    <h3><i class="bi bi-wallet2"></i> Пополнение баланса</h3>
                </div>
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <p class="text-muted">Текущий баланс:</p>
                        <h2 class="text-success">{{ user.profile.balance }} ₽</h2>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label">Сумма пополнения (₽)</label>
                            {{ form.amount }}
                            <small class="text-muted">Минимальная сумма: 1 ₽</small>
                        </div>
                        
                        <div class="row g-2 mb-4">
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(100)">100 ₽</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(500)">500 ₽</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(1000)">1000 ₽</button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(5000)">5000 ₽</button>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-success btn-lg w-100">
                            <i class="bi bi-check-circle"></i> Пополнить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setAmount(amount) {
    document.getElementById('id_amount').value = amount;
}
</script>
{% endblock %}
