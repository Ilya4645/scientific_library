[pytest]
DJANGO_SETTINGS_MODULE = scientific_library.settings
python_files = test_*.py
testpaths = accounts works moderation
addopts =
    --verbose
    --reuse-db
    --nomigrations
    --disable-warnings
    --tb=short
    -p no:cov
markers =
    slow: marks tests as slow
    unit: unit tests
    integration: integration tests
    model: model tests
    view: view tests
    form: form tests
    auth: authorization tests